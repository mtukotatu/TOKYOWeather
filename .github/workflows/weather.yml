name: TOKYOWeather

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  weather:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          cd 天気
          pip install -r requirements.txt

      - name: Run TOKYOWeather
        run: |
          cd 天気
          python weather.py
